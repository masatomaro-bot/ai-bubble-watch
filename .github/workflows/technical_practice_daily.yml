name: Technical Practice Daily (地合い + FFTYスクリーニング)

on:
  schedule:
    # UTC日曜〜木曜 22:00 = JST月曜〜金曜 07:00
    # (US市場の直近取引日の終値が確定した後、日本の朝に結果を見られるように
    #  曜日をUTC側で1日前倒ししている。祝日は考慮していないため、休場日は
    #  前営業日と同じデータが出力される)
    - cron: "0 22 * * 0-4"
  workflow_dispatch:
    inputs:
      breadth_universe:
        description: "ブレッドス母集団 (broad=IWV/Russell3000ベース, sp500=軽量版)"
        type: choice
        options: ["broad", "sp500"]
        default: "broad"
      max_breadth_tickers:
        description: "母集団の件数上限(空欄=無制限。初回検証時は動作確認のため500程度を推奨)"
        type: string
        default: ""

permissions:
  contents: write  # 日次結果のJSON履歴(docs/data/history/)をリポジトリにコミットするために必要
  issues: write    # 地合い変化の通知Issueを自動作成するために必要

jobs:
  run:
    runs-on: ubuntu-latest
    # このリポジトリ内では technical-practice/ サブフォルダにスクリプトを
    # 置く想定(既存の慈愛の観察台のコードと混ざらないようにするため)。
    # 別の場所に置く場合はここを変更すること。
    #
    # timeout-minutes: 広域ユニバース(数千銘柄)のyfinance一括取得は所要時間が
    # 未検証のため、既定の360分より短く区切って早期に異常検知できるようにする。
    # 実際にどれくらいかかるかは初回実行のログで確認し、必要なら調整すること。
    timeout-minutes: 90
    defaults:
      run:
        working-directory: technical-practice
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run market climate script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          BREADTH_UNIVERSE: ${{ inputs.breadth_universe || 'broad' }}
          MAX_BREADTH_TICKERS: ${{ inputs.max_breadth_tickers }}
        run: python market_climate.py

      - name: Run FFTY screener
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python ffty_screener.py

      # 「gitをDBにする」方式: market_climate.pyがdocs/data/history/に書き出した
      # 日次JSONをコミット・プッシュする。GitHub Pagesダッシュボード(docs/index.html)
      # はこのJSONを読む。前のステップが途中で失敗していても、market_climate.py
      # 自体が成功していればJSONは書き出されているので if: always() でここは実行する。
      - name: Commit and push history JSON
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/history
          if git diff --cached --quiet; then
            echo "[info] 履歴JSONに変更なし、コミットをスキップ"
          else
            git commit -m "地合い履歴JSONを更新 ($(date -u +%Y-%m-%d))"
            # 2026-09-17の実機実行で、この間に他のPRがmainへマージされて
            # pushがnon-fast-forwardで拒否される事例が発生した。
            # git pull --rebaseしてから再度pushする。
            git pull --rebase origin main
            git push
          fi

      - name: Notify on trend/warning flag changes
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python notify_changes.py
