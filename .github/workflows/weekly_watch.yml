name: Weekly Watch (週間ウォッチ：FactSet・信用・心理・建玉)

on:
  schedule:
    # 土曜 00:30 UTC = JST土曜 09:30 … 金曜公表のFactSet・CFTC、木曜公表のAAIIがそろった後
    - cron: "30 0 * * 6"
    # 日曜 11:30 UTC = JST日曜 20:30 … 日曜夕方のClaudeの予定タスクが手入力タブに書いた
    #   「今週の一文」「警戒③」と、Actionsで取れなかった値を取り込むための再実行
    - cron: "30 11 * * 0"
  workflow_dispatch:
    inputs:
      factset_weeks_back:
        description: "FactSetの号をさかのぼる週数(初回の埋め戻しは60〜80程度)"
        type: string
        default: "60"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: technical-practice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build weekly.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FACTSET_WEEKS_BACK: ${{ inputs.factset_weeks_back || '60' }}
        run: python weekly.py
      - name: Commit and push weekly JSON
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/weekly.json docs/data/weekly_factset.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "[info] 週次JSONに変更なし"
          else
            git commit -m "週間ウォッチJSONを更新 ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push
          fi
