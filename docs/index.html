<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地合いウォッチ</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.25rem;--s6:1.5rem;--s8:2rem;
  --r-md:.5rem;--r-lg:.75rem;--r-xl:1rem;--r-full:9999px;
  --font:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  --mono:'JetBrains Mono',monospace;
  --bg:#f7f6f3;--surf:#ffffff;--off:#f0efeb;--div:#e6e4de;--bdr:#d6d3cc;
  --tx:#232220;--muted:#6b6965;--faint:#8f8d87;
  --pri:#227483;--pri-h:#dcf0f2;
  --ok:#3f7a24;--ok-h:#e1f0d7;
  --err:#a5337d;--err-h:#f8e2ef;
  --warn:#9a4520;--warn-h:#f7e3d4;
  --gold:#96700a;--gold-h:#faedcc;
}
html{-webkit-font-smoothing:antialiased;}
body{min-height:100dvh;font-family:var(--font);font-size:14px;color:var(--tx);background:var(--bg);line-height:1.5;padding-bottom:var(--s8);}
a{color:var(--pri);}
.mono{font-family:var(--mono);}
.wrap{max-width:1280px;margin:0 auto;padding:var(--s6) var(--s4);}

.topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--s3);
  padding:var(--s4);background:var(--surf);border-bottom:1px solid var(--div);}
.topbar h1{font-size:18px;font-weight:800;letter-spacing:-0.01em;}
.topbar .meta{font-size:12px;color:var(--muted);}
.topbar-right{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;}
.btn-link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--pri);
  background:var(--pri-h);border:1px solid #b7dde2;border-radius:var(--r-md);padding:6px 12px;
  text-decoration:none;white-space:nowrap;}
.btn-link:hover{filter:brightness(0.97);}

.notice{display:flex;gap:var(--s2);align-items:flex-start;background:var(--gold-h);border:1px solid #ecd9a4;
  border-radius:var(--r-md);padding:var(--s3) var(--s4);margin-bottom:var(--s5);font-size:12px;color:var(--gold);}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5);}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr;}}

.card{background:var(--surf);border:1px solid var(--div);border-radius:var(--r-lg);padding:var(--s5);margin-bottom:var(--s5);}
.card-title{font-size:13.5px;font-weight:600;color:#57564f;letter-spacing:.03em;margin-bottom:var(--s4);}

.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:var(--r-full);}
.badge.ok{background:var(--ok-h);color:var(--ok);}
.badge.err{background:var(--err-h);color:var(--err);}
.badge.warn{background:var(--warn-h);color:var(--warn);}
.badge.muted{background:var(--off);color:var(--muted);}

.hero-state{font-size:22px;font-weight:800;letter-spacing:-0.01em;margin-bottom:var(--s2);}
.sub{font-size:12px;color:var(--muted);}

.sector-grid{display:flex;gap:6px;margin:var(--s3) 0;flex-wrap:wrap;}
.sector-cell{flex:1;min-width:40px;height:34px;border-radius:6px;}
.story-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:var(--s3);}
.story-card{border:1px solid var(--div);border-radius:var(--r-md);padding:var(--s4);background:var(--off);}
.story-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3);}
.story-ticker{font:700 18px var(--mono);}
.story-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:var(--s3);}
.story-metric{background:var(--surf);border-radius:6px;padding:7px 9px;}
.story-metric span{display:block;font-size:10px;color:var(--muted);}
.story-metric strong{font-family:var(--mono);font-size:13px;}
.story-note{font-size:11px;color:var(--muted);margin-bottom:var(--s3);}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:11px;color:var(--muted);}
.dot{display:inline-block;width:8px;height:8px;border-radius:999px;margin-right:5px;vertical-align:middle;}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--faint);font-weight:600;font-size:10.5px;padding-bottom:8px;border-bottom:1px solid var(--div);}
td{padding:8px 0;border-bottom:1px solid var(--off);}
td.num{text-align:right;font-family:var(--mono);}
tr:last-child td{border-bottom:none;}

.stat{display:flex;flex-direction:column;gap:4px;background:var(--off);border-radius:var(--r-md);padding:var(--s3) var(--s4);}
.stat .label{font-size:11px;color:var(--muted);}
.stat .value{font-family:var(--mono);font-size:20px;font-weight:700;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:var(--s3);margin-bottom:var(--s4);}

.pill-row{display:flex;gap:var(--s2);flex-wrap:wrap;}
.pill{font-size:10.5px;font-family:var(--mono);background:var(--off);color:var(--muted);padding:3px 8px;border-radius:999px;}

.compare-line{font-size:13px;}
.compare-stack{display:flex;flex-direction:column;gap:8px;margin-bottom:var(--s4)}
.delta{font-size:11px;margin-top:2px;}

.flag-row{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--off);}
.flag-row:last-child{border-bottom:none;}
.flag-dot{flex-shrink:0;width:10px;height:10px;border-radius:999px;margin-top:4px;}
.flag-dot.active{background:var(--warn);}
.flag-dot.inactive{background:var(--off);border:1px solid var(--div);}
.flag-label{font-size:13px;font-weight:600;}
.flag-detail{font-size:11.5px;color:var(--muted);margin-top:2px;}

.loading,.error{padding:var(--s6);text-align:center;color:var(--muted);font-size:13px;}
.footer{max-width:1280px;margin:0 auto;padding:var(--s6) var(--s4);font-size:11px;color:var(--faint);text-align:center;}

.bar-outer{height:8px;background:var(--off);border-radius:999px;overflow:hidden;position:relative;}
.bar-inner{position:absolute;top:0;bottom:0;border-radius:999px;}
</style>

<script src="opportunity-rules.js" defer></script>
<script src="issuer-profiles.js" defer></script>

<div class="wrap">

<script>
const TREND_LABELS = {
  confirmed_uptrend: { label: "確認された上昇トレンド", cls: "ok" },
  uptrend_under_pressure: { label: "圧力下の上昇トレンド", cls: "warn" },
  correction: { label: "調整局面", cls: "err" },
  "不明": { label: "判定不能(データ不足)", cls: "muted" },
};
const REGIME_LABELS = {
  "RISK-ON": { label: "RISK-ON", cls: "ok" },
  "RISK-OFF": { label: "RISK-OFF", cls: "err" },
  "MIXED": { label: "MIXED", cls: "warn" },
  "不明": { label: "不明", cls: "muted" },
};
const QUADRANT_COLOR = { "主導": "var(--ok)", "改善": "var(--pri)", "鈍化": "var(--warn)", "遅行": "var(--err)", "不明": "var(--faint)" };
const TEMP_COLOR = { "上昇": "var(--ok)", "買い集め": "var(--pri)", "中立": "var(--faint)", "調整": "var(--err)", "不明": "var(--off)" };

function fmtPct(v) {
  if (v === null || v === undefined) return "-";
  const sign = v > 0 ? "+" : "";
  return `${sign}${v}%`;
}
function pctColor(v) {
  if (v === null || v === undefined) return "var(--muted)";
  return v > 0 ? "var(--ok)" : v < 0 ? "var(--err)" : "var(--muted)";
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function trendCard(name, idx) {
  const t = idx.trend_state || {};
  const info = TREND_LABELS[t.state] || TREND_LABELS["不明"];
  return `
    <div class="card">
      <div class="card-title">${esc(name)}</div>
      <div class="hero-state">${esc(info.label)}</div>
      <span class="badge ${info.cls}">${esc(t.state || "不明")}</span>
      <div class="stat-row" style="margin-top:var(--s4)">
        <div class="stat"><div class="label">売り抜け日数</div><div class="value">${idx.distribution_days ?? "-"}</div></div>
        <div class="stat"><div class="label">失速日数</div><div class="value">${idx.stalling_days ?? "-"}</div></div>
        <div class="stat"><div class="label">FTD確認日</div><div class="value" style="font-size:14px">${t.ftd_date || "未確認"}</div></div>
      </div>
      ${t.note ? `<div class="sub">${esc(t.note)}</div>` : ""}
    </div>`;
}

function sectorGrid(sectors) {
  const cells = Object.entries(sectors).map(([etf, s]) =>
    `<div class="sector-cell" style="background:${TEMP_COLOR[s.temperature] || TEMP_COLOR["不明"]}" title="${esc(s.name_jp)}: ${esc(s.temperature)}"></div>`
  ).join("");
  return `<div class="sector-grid">${cells}</div>`;
}

function sectorTable(sectors) {
  const rows = Object.entries(sectors)
    .sort((a, b) => (b[1].day_change_pct ?? -999) - (a[1].day_change_pct ?? -999))
    .map(([etf, s]) => `
      <tr>
        <td>${esc(s.name_jp)} <span class="sub mono">${esc(etf)}</span></td>
        <td class="num" style="color:${pctColor(s.day_change_pct)}">${fmtPct(s.day_change_pct)}</td>
        <td class="num" style="color:${pctColor(s.one_week_pct)}">${fmtPct(s.one_week_pct)}</td>
        <td class="num" style="color:${pctColor(s.one_month_pct ?? s.monthly_return_pct)}">${fmtPct(s.one_month_pct ?? s.monthly_return_pct)}</td>
        <td class="num" style="color:${QUADRANT_COLOR[s.quadrant] || "var(--muted)"}">${esc(s.quadrant)}</td>
      </tr>`).join("");
  return `
    <table>
      <thead><tr><th>セクター／テーマ</th><th style="text-align:right">1D</th><th style="text-align:right">1W</th><th style="text-align:right">1M</th><th style="text-align:right">RRG</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function leadersTable(leaders) {
  const rows=(leaders||[]).map(row=>`<tr><td class="mono"><strong>${esc(row.ticker)}</strong></td><td class="num">${esc(row.rs_percentile??"-")}</td><td class="num" style="color:${pctColor(row.day_change_pct)}">${fmtPct(row.day_change_pct)}</td><td class="num" style="color:${pctColor(row.one_month_pct)}">${fmtPct(row.one_month_pct)}</td><td class="num" style="color:${pctColor(row.three_month_pct)}">${fmtPct(row.three_month_pct)}</td></tr>`).join("");
  return rows?`<table><thead><tr><th>銘柄</th><th style="text-align:right">RS</th><th style="text-align:right">1D</th><th style="text-align:right">1M</th><th style="text-align:right">3M</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="sub">該当銘柄なし</div>';
}

function storyPrompt(row,date){
  return `${row.ticker}が${date}に${fmtPct(row.day_change_pct)}上昇し、S&P500を${fmtPct(row.market_excess_pct)}上回りました。出来高は20日平均の${row.volume_ratio_20d}倍、1週間${fmtPct(row.one_week_pct)}、1か月${fmtPct(row.one_month_pct)}です。最新の企業IR、SEC、決算、信頼できる報道、アナリスト変更を検索し、上昇原因を特定してください。出来事→市場の解釈→売上・利益への影響の3層で説明し、一時的需給か6〜12か月続くストーリーかを判定してください。原因を確認できない場合は推測で断定しないでください。`;
}

function storyCandidatesSection(rows,date){
  if(!rows?.length)return `<div class="sub">本日は「市場比＋2%以上」かつ「出来高20日平均比1.5倍以上」を満たす調査候補がありません。</div>`;
  return `<div class="story-grid">${rows.map(row=>`<article class="story-card">
    <div class="story-head"><span class="story-ticker">${esc(row.ticker)}</span><span class="badge muted">原因未確認</span></div>
    <div class="story-metrics">
      <div class="story-metric"><span>1D</span><strong style="color:${pctColor(row.day_change_pct)}">${fmtPct(row.day_change_pct)}</strong></div>
      <div class="story-metric"><span>市場超過</span><strong style="color:${pctColor(row.market_excess_pct)}">${fmtPct(row.market_excess_pct)}</strong></div>
      <div class="story-metric"><span>出来高／20日平均</span><strong>${esc(row.volume_ratio_20d)}倍</strong></div>
      <div class="story-metric"><span>1W ／ 1M</span><strong>${fmtPct(row.one_week_pct)} ／ ${fmtPct(row.one_month_pct)}</strong></div>
    </div>
    <p class="story-note">機械選出：${esc(row.selection_reason)}。価格だけでは上昇理由は分かりません。</p>
    <a class="btn-link" target="_blank" rel="noopener noreferrer" href="https://chatgpt.com/?q=${encodeURIComponent(storyPrompt(row,date))}">ChatGPTで物語を分析 ↗</a>
  </article>`).join("")}</div>`;
}

function breadthSection(d) {
  const ext = d.breadth_extended || {};
  const near = d.breadth_near_52w || {};
  const but = d.broad_universe_technicals || {};
  return `
    <div class="stat-row">
      <div class="stat"><div class="label">母集団 (${esc(d.breadth_universe_source || "-")})</div><div class="value">${ext.universe_size ?? "-"}</div></div>
      <div class="stat"><div class="label">新52週高値</div><div class="value" style="color:var(--ok)">${ext.new_52w_highs ?? "-"}</div></div>
      <div class="stat"><div class="label">新52週安値</div><div class="value" style="color:var(--err)">${ext.new_52w_lows ?? "-"}</div></div>
      <div class="stat"><div class="label">値上がり/値下がり</div><div class="value" style="font-size:15px">${ext.advancers ?? "-"} / ${ext.decliners ?? "-"}</div></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">出来高ブレッド</div><div class="value">${ext.up_volume_pct ?? "-"}%</div></div>
      <div class="stat"><div class="label">累積A/Dライン</div><div class="value">${d.cumulative_ad_line ?? "-"}</div></div>
      <div class="stat"><div class="label">50日線上比率</div><div class="value">${but.pct_above_50dma ?? "-"}%</div></div>
      <div class="stat"><div class="label">200日線上比率</div><div class="value">${but.pct_above_200dma ?? "-"}%</div></div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="label">トレンドテンプレート合格率</div><div class="value">${but.trend_template_pass_rate_pct ?? "-"}%</div>
        <div class="sub">${but.trend_template_pass_count ?? "-"}銘柄が8条件合格</div></div>
      <div class="stat"><div class="label">52週高値圏/安値圏(2%以内)</div><div class="value" style="font-size:15px">${near.near_high_pct ?? "-"}% / ${near.near_low_pct ?? "-"}%</div></div>
    </div>`;
}

function stressGaugesSection(gauges) {
  if (!gauges) return `<div class="sub">データなし</div>`;
  const vix = gauges.vix || {};
  const rows = [
    ["credit_hyg_ief", "HYG/IEF(信用選好)"],
    ["breadth_rsp_spy", "RSP/SPY(値がさ株への集中度)"],
    ["risk_appetite_iwm_spy", "IWM/SPY(小型株選好)"],
    ["semis_soxx_spy", "SOXX/SPY(半導体選好)"],
  ].map(([key, label]) => {
    const g = gauges[key] || {};
    return `
      <div class="stat">
        <div class="label">${esc(label)}</div>
        <div class="value" style="font-size:16px">${g.ratio ?? "-"}</div>
        <div class="delta mono" style="color:${pctColor(g.change_10d_pct)}">${fmtPct(g.change_10d_pct)}(10営業日)</div>
      </div>`;
  }).join("");
  return `
    <div class="stat-row">
      <div class="stat">
        <div class="label">VIX(恐怖指数)</div>
        <div class="value">${vix.level ?? "-"}</div>
        <div class="delta mono" style="color:${pctColor(vix.change_10d)}">${vix.change_10d != null ? (vix.change_10d > 0 ? "+" : "") + vix.change_10d : "-"}(10営業日)</div>
      </div>
      ${rows}
    </div>
    <div class="sub" style="margin-top:var(--s3)">
      比率の上昇/下降が良い/悪いを意味するとは限らない(例: RSP/SPYの上昇は値がさ株への集中が
      和らいでいることを示唆するが、それ自体を売買シグナルとして使うものではない)。色は方向を
      示すだけで、良し悪しの判定ではない。
    </div>`;
}

function warningFlagsSection(flags) {
  if (!flags || !flags.length) return `<div class="sub">データなし</div>`;
  const activeCount = flags.filter((f) => f.active).length;
  const rows = flags.map((f) => `
    <div class="flag-row">
      <div class="flag-dot ${f.active ? "active" : "inactive"}"></div>
      <div>
        <div class="flag-label" style="color:${f.active ? "var(--warn)" : "var(--tx)"}">${esc(f.label)}</div>
        <div class="flag-detail">${esc(f.detail || "")}</div>
      </div>
    </div>`).join("");
  return `
    <div class="hero-state" style="font-size:16px;margin-bottom:var(--s3)">
      ${activeCount}/${flags.length} 件が点灯中
    </div>
    ${rows}
    <div class="sub" style="margin-top:var(--s4)">
      崩れの前によく見られるとされる既知の乖離パターンを機械的に判定したものであり、
      下落を予測するものではない(点灯しても下落しないことも、点灯せずに下落することもある)。
      閾値は自前設計で有効性は未検証。売買判断の根拠にはしないでください。
    </div>`;
}

function statDelta(label, curr, prev, opts) {
  opts = opts || {};
  const decimals = opts.decimals ?? 0;
  const suffix = opts.suffix ?? "";
  const higherIsGood = opts.higherIsGood; // undefined = 良し悪しを判定しない(中立色)
  let deltaHtml = `<span class="sub">前日データなし</span>`;
  if (curr !== null && curr !== undefined && prev !== null && prev !== undefined) {
    const diff = Number((curr - prev).toFixed(decimals));
    const sign = diff > 0 ? "+" : "";
    let color = "var(--muted)";
    if (higherIsGood !== undefined && diff !== 0) {
      color = (diff > 0) === higherIsGood ? "var(--ok)" : "var(--err)";
    }
    deltaHtml = `<span class="mono" style="color:${color}">前日比 ${sign}${diff}${suffix}</span>`;
  }
  return `
    <div class="stat">
      <div class="label">${esc(label)}</div>
      <div class="value">${curr ?? "-"}${curr !== null && curr !== undefined ? suffix : ""}</div>
      <div class="delta">${deltaHtml}</div>
    </div>`;
}

function stateChangeLine(label, currState, prevState) {
  const currInfo = TREND_LABELS[currState] || TREND_LABELS["不明"];
  if (prevState === null || prevState === undefined) {
    return `<div class="compare-line">${esc(label)}: <span class="badge ${currInfo.cls}">${esc(currInfo.label)}</span> <span class="sub">(前日データなし)</span></div>`;
  }
  if (currState === prevState) {
    return `<div class="compare-line">${esc(label)}: <span class="badge ${currInfo.cls}">${esc(currInfo.label)}</span> <span class="sub">(変化なし)</span></div>`;
  }
  const prevInfo = TREND_LABELS[prevState] || TREND_LABELS["不明"];
  return `<div class="compare-line">${esc(label)}: <span class="badge ${prevInfo.cls}">${esc(prevInfo.label)}</span> → <span class="badge ${currInfo.cls}">${esc(currInfo.label)}</span></div>`;
}

function sectorTempChanges(currSectors, prevSectors) {
  if (!prevSectors) return `<div class="sub">前日データなし</div>`;
  const changed = [];
  for (const [etf, s] of Object.entries(currSectors)) {
    const prevTemp = (prevSectors[etf] || {}).temperature;
    if (prevTemp && prevTemp !== s.temperature) {
      changed.push(
        `<span class="pill">${esc(s.name_jp)}: ${esc(prevTemp)} → <span style="color:${TEMP_COLOR[s.temperature] || "var(--muted)"}">${esc(s.temperature)}</span></span>`
      );
    }
  }
  if (!changed.length) return `<div class="sub">前日から体温が変わったセクターはありません</div>`;
  return `<div class="pill-row">${changed.join("")}</div>`;
}

        ${statDelta("新52週高値", ext.new_52w_highs, prevExt.new_52w_highs, { higherIsGood: true })}
        ${statDelta("新52週安値", ext.new_52w_lows, prevExt.new_52w_lows, { higherIsGood: false })}
        ${statDelta("値上がり銘柄", ext.advancers, prevExt.advancers, { higherIsGood: true })}
        ${statDelta("値下がり銘柄", ext.decliners, prevExt.decliners, { higherIsGood: false })}
      </div>

        ${statDelta("出来高ブレッド", ext.up_volume_pct, prevExt.up_volume_pct, { decimals: 1, suffix: "%", higherIsGood: true })}

        ${statDelta("200日線上比率", but.pct_above_200dma, prevBut.pct_above_200dma, { decimals: 1, suffix: "%", higherIsGood: true })}
        ${statDelta("トレンドテンプレート合格率", but.trend_template_pass_rate_pct, prevBut.trend_template_pass_rate_pct, { decimals: 1, suffix: "%", higherIsGood: true })}

function sparklineSvg(values, opts) {
  opts = opts || {};
  const width = opts.width || 320;
  const height = opts.height || 44;
  const color = opts.color || "var(--pri)";
  const valid = values.filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
  if (valid.length < 2) {
    return `<div class="sub" style="height:${height}px;display:flex;align-items:center">データ不足(複数日分の履歴が蓄積されるまでお待ちください)</div>`;
  }
  const min = Math.min(...valid);
  const max = Math.max(...valid);
  const range = max - min || 1;
  const n = values.length;
  const stepX = n > 1 ? width / (n - 1) : 0;
  const pad = 4;
  const points = values.map((v, i) => {
    if (v === null || v === undefined || Number.isNaN(v)) return null;
    const x = i * stepX;
    const y = height - pad - ((v - min) / range) * (height - pad * 2);
    return [x, y];
  });
  // 欠損(未取得日)をまたぐ区間は線をつながず、連続する区間ごとに分けて描く
  const segments = [];
  let current = [];
  for (const p of points) {
    if (p === null) {
      if (current.length) segments.push(current);
      current = [];
    } else {
      current.push(p);
    }
  }
  if (current.length) segments.push(current);
  const polylines = segments.map((seg) =>
    `<polyline points="${seg.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" ")}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`
  ).join("");
  const last = points[points.length - 1];
  const lastDot = last ? `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${color}"/>` : "";
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}" preserveAspectRatio="none" style="display:block">${polylines}${lastDot}</svg>`;
}

function sparklineRow(label, values, opts) {
  opts = opts || {};
  const valid = values.filter((v) => v !== null && v !== undefined && !Number.isNaN(v));
  const latestVal = valid.length ? valid[valid.length - 1] : null;
  const suffix = opts.suffix || "";
  return `
    <div style="margin-bottom:var(--s4)">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <div class="sub">${esc(label)}</div>
        <div class="mono" style="font-size:13px;font-weight:700">${latestVal ?? "-"}${latestVal !== null ? suffix : ""}</div>
      </div>
      ${sparklineSvg(values, opts)}
    </div>`;
}

function trendSparklinesSection(history) {
  if (!history.length) return `<div class="sub">データなし</div>`;
  const adLine = history.map((h) => (h.data.cumulative_ad_line ?? null));
  const pct50 = history.map((h) => ((h.data.broad_universe_technicals || {}).pct_above_50dma ?? null));
  const netBreadth = history.map((h) => {
    const ext = h.data.breadth_extended || {};
    return (ext.new_52w_highs != null && ext.new_52w_lows != null) ? ext.new_52w_highs - ext.new_52w_lows : null;
  });
  const vix = history.map((h) => ((h.data.stress_gauges || {}).vix || {}).level ?? null);

  return `
    ${sparklineRow("累積A/Dライン", adLine, { color: "var(--pri)" })}
    ${sparklineRow("50日線上比率", pct50, { color: "var(--ok)", suffix: "%" })}
    ${sparklineRow("新高値 - 新安値(純増数)", netBreadth, { color: "var(--gold)" })}
    ${sparklineRow("VIX水準", vix, { color: "var(--err)" })}
    <div class="sub" style="margin-top:var(--s2)">${history[0].date} 〜 ${history[history.length - 1].date}(取得できた範囲、最大30営業日)。指数は高値圏でも、これらが切り下がる「痩せ方」に注目する。</div>`;
}

function renderTradingViewCalendar(containerId) {
  // content.innerHTML でscriptタグを流し込んでも(HTML仕様上)実行されないため、
  // DOM APIで明示的にscript要素を作って追加する。
  const container = document.getElementById(containerId);
  if (!container) return;
  const script = document.createElement("script");
  script.type = "text/javascript";
  script.src = "https://s3.tradingview.com/external-embedding/embed-widget-events.js";
  script.async = true;
  script.text = JSON.stringify({
    colorTheme: "dark",
    isTransparent: true,
    width: "100%",
    height: "500",
    locale: "ja",
    importanceFilter: "-1,0,1",
    countryFilter: "us",
  });
  container.appendChild(script);
}

async function tryFetchJson(path) {
  try {
    const res = await fetch(path, { cache: "no-store" });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

function dateStr(d) {
  return d.toISOString().slice(0, 10);
}

async function loadRecentHistory(latestDateStr, maxDays) {
  // マニフェストを持たない素朴な実装: 直近N暦日ぶんのファイル名を推測して
  // fetchし、存在した(=土日祝や未実行日でなかった)ものだけを使う。
  const base = new Date(latestDateStr + "T00:00:00Z");
  const promises = [];
  for (let i = 0; i < maxDays; i++) {
    const d = new Date(base);
    d.setUTCDate(d.getUTCDate() - i);
    const ds = dateStr(d);
    promises.push(tryFetchJson(`data/history/${ds}.json`).then((data) => (data ? { date: ds, data } : null)));
  }
  const results = await Promise.all(promises);
  return results.filter(Boolean).sort((a, b) => (a.date < b.date ? -1 : 1));
}

const OFFENSE_LOOKBACK_TRADING_DAYS = 5; // 「直近N日」の新規リーダー・象限変化の比較対象

function pickCompareEntry(history, todayIdx) {
  // 直近OFFENSE_LOOKBACK_TRADING_DAYS営業日前のデータを比較対象にする。
  // 履歴がまだ短い場合は、取得できている最も古い日を使う。
  if (todayIdx <= 0) return null;
  const lookbackIdx = todayIdx - OFFENSE_LOOKBACK_TRADING_DAYS;
  return history[lookbackIdx >= 0 ? lookbackIdx : 0];
}

function newcomerLeadersSection(latestLeaders, compareEntry) {
  if (!compareEntry) return `<div class="sub">比較対象となる過去データがまだありません。</div>`;
  const prevTickers = new Set((compareEntry.data.market_leaders || []).map((l) => l.ticker));
  const newcomers = (latestLeaders || []).filter((l) => !prevTickers.has(l.ticker) && window.IssuerProfiles?.get(l.ticker).status === 'eligible');
  if (!newcomers.length) {
    return `<div class="sub">${esc(compareEntry.date)}時点のMarket Leadersと比べて地域確認を通過した企業の新規入りはありません。</div>`;
  }
  const pills = newcomers.map((l) =>
    `<span class="pill">${esc(l.ticker)}(RS ${l.rs_percentile})</span>`
  ).join("");
  return `
    <div class="pill-row">${pills}</div>
    <div class="sub" style="margin-top:var(--s3)">${esc(compareEntry.date)}時点のMarket Leaders上位には入っていなかった銘柄。</div>`;
}

function themeQuadrantChanges(currThemes, compareEntry) {
  if (!compareEntry) return `<div class="sub">比較対象となる過去データがまだありません。</div>`;
  const prevThemes = compareEntry.data.themes || {};
  const changed = [];
  for (const [etf, t] of Object.entries(currThemes || {})) {
    const prevQ = (prevThemes[etf] || {}).quadrant;
    if (prevQ && prevQ !== t.quadrant) {
      changed.push(
        `<span class="pill">${esc(t.name_jp)}: ${esc(prevQ)} → <span style="color:${QUADRANT_COLOR[t.quadrant] || "var(--muted)"}">${esc(t.quadrant)}</span></span>`
      );
    }
  }
  if (!changed.length) {
    return `<div class="sub">${esc(compareEntry.date)}から象限が変わったテーマはありません。</div>`;
  }
  return `
    <div class="pill-row">${changed.join("")}</div>
    <div class="sub" style="margin-top:var(--s3)">${esc(compareEntry.date)}との比較。</div>`;
}

function historyStrip(history) {
  if (!history.length) return "";
  const cells = history.map((h) => {
    const state = (h.data.overall_trend_state) || "不明";
    const info = TREND_LABELS[state] || TREND_LABELS["不明"];
    const color = { ok: "var(--ok)", err: "var(--err)", warn: "var(--warn)", muted: "var(--faint)" }[info.cls];
    return `<div class="mono" title="${h.date}: ${esc(info.label)}" style="flex:1;min-width:6px;height:24px;background:${color};border-radius:3px"></div>`;
  }).join("");
  return `
    <div class="card">
      <div class="card-title">地合い判定の推移(直近${history.length}営業日、取得できた範囲)</div>
      <div style="display:flex;gap:3px;">${cells}</div>
      <div class="sub" style="margin-top:var(--s3)">${history[0].date} 〜 ${history[history.length - 1].date}</div>
    </div>`;
}

async function main() {
  const latest = await tryFetchJson("data/history/latest.json");
  const content = document.getElementById("content");
  const meta = document.getElementById("topbar-meta");

  if (!latest) {
    content.innerHTML = `<div class="error">
      データがまだありません。GitHub Actionsの日次実行が一度も成功していないか、
      GitHub Pagesの配信設定(Settings → Pages → Source)が docs/ フォルダを
      指していない可能性があります。
    </div>`;
    meta.textContent = "";
    return;
  }

  window.watchLatest = latest;
  window.dispatchEvent(new Event("watch-data"));
  meta.textContent = `データ日: ${latest.date}`;

  const regimeInfo = REGIME_LABELS[(latest.market_regime || {}).judgement] || REGIME_LABELS["不明"];
  const overallInfo = TREND_LABELS[latest.overall_trend_state] || TREND_LABELS["不明"];

  content.innerHTML = `
    <div class="card">
      <div class="card-title">本日の地合い(O'Neil/IBD式フォロースルー・デイ判定)</div>
      <div class="hero-state">${esc(overallInfo.label)}</div>
      <span class="badge ${overallInfo.cls}">${esc(latest.overall_trend_state)}</span>
      <span class="badge ${regimeInfo.cls}" style="margin-left:var(--s2)" title="セクター体温の多数決による参考指標(オニミネ流の近似)">
        参考: セクター多数決 ${esc(regimeInfo.label)}
      </span>
    </div>

    <div class="card">
      <div class="card-title">警戒チェックリスト(崩れの前兆として知られる乖離パターン)</div>
      ${warningFlagsSection(latest.warning_flags)}
    </div>

    <div id="comparison-section"><div class="card"><div class="sub">前営業日との比較を読み込み中...</div></div></div>

    <div class="grid2">
      ${trendCard("NASDAQ総合", latest.nasdaq || {})}
      ${trendCard("S&P500", latest.sp500 || {})}
    </div>

    <div class="card">
      <div class="card-title">市場ストレス指標(株価内部だけでは見えない、相場の外側の変化)</div>
      ${stressGaugesSection(latest.stress_gauges)}
    </div>

    <div id="history-strip"></div>

    <div class="card">
      <div class="card-title">今日、市場が買った物語（半自動調査）</div>
      <div class="sub" style="margin-bottom:var(--s4)">価格・出来高の異変を機械が選びます。上昇理由は断定せず、ボタンから最新情報を調べます。</div>
      ${storyCandidatesSection(latest.story_candidates || [], latest.date)}
    </div>

    <div class="card">
      <div class="card-title">推移(指数が高値圏でも先に痩せていないか)</div>
      <div id="trend-sparklines"><div class="sub">読み込み中...</div></div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-title">セクター体温(11 GICSセクター) — 1D順</div>
        ${sectorGrid(latest.sectors || {})}
        <div class="legend">
          <span><span class="dot" style="background:var(--ok)"></span>上昇</span>
          <span><span class="dot" style="background:var(--pri)"></span>買い集め</span>
          <span><span class="dot" style="background:var(--faint)"></span>中立</span>
          <span><span class="dot" style="background:var(--err)"></span>調整</span>
        </div>
        <div class="sub" style="margin-top:var(--s3)">体温は50日・200日線と市場比の状態、1D／1W／1Mは実際の騰落率です。短期反発と継続的な資金流入を分けて見ます。</div>
        <div style="margin-top:var(--s4)">${sectorTable(latest.sectors || {})}</div>
      </div>
      <div class="card">
        <div class="card-title">テーマ・ローテーション(代理ETF、近似)</div>
        ${sectorTable(latest.themes || {})}
        <div class="card-title" style="margin-top:var(--s4)">象限の変化</div>
        <div id="theme-rotation-changes"><div class="sub">読み込み中...</div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">経済カレンダー(TradingView提供)</div>
      <div id="tv-economic-calendar" class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>
      </div>
      <div class="sub" style="margin-top:var(--s3)">
        TradingView社の公式埋め込みウィジェットです。このリポジトリの日次パイプライン(GitHub Actions)が
        収集・保存しているデータではないため、履歴保存や前日比較の対象にはなりません。
      </div>
    </div>

    <div class="card">
      <div class="card-title">市場の幅(ブレッドス) — 母集団: ${esc(latest.breadth_universe_source || "-")}</div>
      ${breadthSection(latest)}
    </div>

    <div class="card">
      <div class="card-title">Market Leaders(母集団内RS百分位ランキング上位)</div>
      <div class="sub" style="margin-bottom:var(--s3)">地合い確認用の簡潔なランキングです。個別候補の調査・登録は機会ウォッチで行います。</div>
      <div data-leader-list="market_leaders">${leadersTable(latest.market_leaders)}</div>
      <div class="card-title" style="margin-top:var(--s4)">新規リーダー</div>
      <div id="newcomer-leaders"><div class="sub">読み込み中...</div></div>
    </div>

    <div class="card">
      <div class="card-title">トレンドテンプレート合格銘柄のRS上位(O'Neil/Minervini式8条件通過銘柄)</div>

      <div data-leader-list="trend_template_leaders">${leadersTable(latest.trend_template_leaders)}</div>
    </div>

  loadRecentHistory(latest.date, 30).then((history) => {
    document.getElementById("history-strip").innerHTML = historyStrip(history);
    document.getElementById("trend-sparklines").innerHTML = trendSparklinesSection(history);

    // history は日付昇順。末尾が本日分のはずなので、その1つ前が「前営業日」。
    // (取得できたファイルのみが入っているので、休場日等は自動的に飛ばされる)
    const todayIdx = history.findIndex((h) => h.date === latest.date);
    const prevEntry = todayIdx > 0 ? history[todayIdx - 1] : null;
    document.getElementById("comparison-section").innerHTML = comparisonSection(latest, prevEntry);

    window.watchPrevious = prevEntry;
    window.watchHistoryLoaded = true;
    window.dispatchEvent(new Event("watch-data"));
    const offenseCompareEntry = pickCompareEntry(history, todayIdx);
    document.getElementById("newcomer-leaders").innerHTML =
      newcomerLeadersSection(latest.market_leaders, offenseCompareEntry);
    document.getElementById("theme-rotation-changes").innerHTML =
      themeQuadrantChanges(latest.themes, offenseCompareEntry);
  });
}

main();
</script>
