# 慈愛の観察台 - 日次パイプライン設定
# ここに自分のポートフォリオ/ウォッチリスト銘柄を記載する。
# sector / industry を省略した場合は実行時に yfinance から自動取得する
# (自動取得値をキャッシュしたい場合はここに書き足してよい)。
# holding: true は実際に保有しているポートフォリオ銘柄、省略時(false)は観察のみ(未保有)。

benchmark: SPY # RS(相対力)計算の基準指数

# Market Breadth / Distribution Day 判定に使う市場指数
# (全市場スクリーニングはしないが、地合い判定には主要指数の値動きを使う)
market_indices:
  - symbol: "^GSPC"
    name: S&P500
  - symbol: "^IXIC"
    name: Nasdaq Composite

# ウォッチリスト銘柄
watchlist:
  # ポートフォリオ(保有銘柄)
  - ticker: NVDA
    holding: true
  - ticker: GOOGL
    holding: true
  - ticker: AVGO
    holding: true
  # 観察銘柄(未保有・監視のみ)
  - ticker: MSFT
  - ticker: AAPL
  - ticker: META
  - ticker: TSM
  - ticker: MU
  - ticker: AMD
  - ticker: PLTR
